name: Update packages

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - chrome-devtools-mcp
          - context7-mcp
          - esa-mcp-server
          - freee-mcp
          - mastra-mcp-docs-server
          - mcp-gsheets
          - nd-mcp
          - notion-mcp-server
          - playwright-mcp
          - serena
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Configure git
        run: |
          USER_ID=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email "$USER_ID+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      - name: Update package
        id: update-package
        run: |
          if [[ "${{ matrix.package }}" == "mastra-mcp-docs-server" ]]; then
            # The monorepo's releases feed is dominated by other packages, so
            # nix-update never finds this one there; read the tags instead.
            VERSION=$(gh api --paginate \
              'repos/mastra-ai/mastra/git/matching-refs/tags/@mastra/mcp-docs-server@' \
              --jq '.[].ref' \
              | sed 's|.*@||' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            NIX_UPDATE_FLAGS="--version $VERSION --custom-dep docs"
          elif [[ "${{ matrix.package }}" == "freee-mcp" ]]; then
            NIX_UPDATE_FLAGS="--subpackage deps"
          elif [[ "${{ matrix.package }}" == "context7-mcp" ]]; then
            NIX_UPDATE_FLAGS='--version-regex @upstash/context7-mcp@(.*)'
          elif [[ "${{ matrix.package }}" == "chrome-devtools-mcp" ]]; then
            NIX_UPDATE_FLAGS='--version-regex chrome-devtools-mcp-v(.*)'
          else
            NIX_UPDATE_FLAGS=""
          fi

          OUTPUT=$(nix run nixpkgs#nix-update \
            -- --flake ${{ matrix.package }} $NIX_UPDATE_FLAGS --print-commit-message)

          # Extract title (first line containing package name)
          COMMIT_TITLE=$(echo "$OUTPUT" | grep -E "^${{ matrix.package }}:" | head -1)

          # Extract body (Diff and Changelog lines)
          COMMIT_BODY=$(echo "$OUTPUT" | grep -E "^(Diff:|Changelog:)" | sed 's/$/\n/')

          echo "title=$COMMIT_TITLE" >> $GITHUB_OUTPUT
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMIT_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: auto-update/${{ matrix.package }}
          title: ${{ steps.update-package.outputs.title }}
          body: |
            ${{ steps.update-package.outputs.body }}
          commit-message: |
            ${{ steps.update-package.outputs.title }}

            ${{ steps.update-package.outputs.body }}
          sign-commits: true

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-number
        run: |
          gh pr merge --auto --merge "${{ steps.create-pr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
